<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Safety Protection Engine</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="shield-icon">🛡️</span>
        <div>
          <h1>Cyber Safety</h1>
          <span class="version-label">v1.1 Real-Time Engine</span>
        </div>
      </div>
      <div class="status-indicator">
        <span id="backend-status-dot" class="status-dot offline"></span>
        <span id="protection-status-label" class="status-text">Connecting...</span>
      </div>
    </header>

    <!-- Domain Card -->
    <div class="card domain-card">
      <div class="card-label">Inspected Domain</div>
      <div id="domain-name" class="domain-value">Loading...</div>
    </div>

    <!-- Main Classification Card -->
    <div class="card status-card">
      <div class="card-label">Threat Classification</div>
      <div id="status-badge" class="badge unknown">UNKNOWN</div>
      
      <div class="metrics-row">
        <div class="metric-col">
          <span class="metric-label">Risk Level</span>
          <span id="risk-level-value" class="metric-val">NONE</span>
        </div>
        <div class="metric-col">
          <span class="metric-label">Confidence</span>
          <span id="confidence-value" class="metric-val">50%</span>
        </div>
      </div>

      <div class="reasons-box">
        <div class="reasons-label">Primary Analysis Reasons</div>
        <ul id="reasons-list" class="reasons-list">
          <li>Inspecting website against threat intelligence pipeline...</li>
        </ul>
      </div>
    </div>

    <!-- Evidence Sources Breakdown -->
    <div class="card evidence-card">
      <div class="evidence-header">
        <span class="evidence-title">Supporting Evidence</span>
        <span id="evidence-count-badge" class="evidence-count-tag">0 Sources</span>
      </div>
      <div id="evidence-list-container" class="evidence-list">
        <div class="empty-evidence">No external threat evidence linked.</div>
      </div>
    </div>

    <!-- Footer CTA -->
    <footer class="footer">
      <button id="open-dashboard-btn" class="btn-primary">Open Security Portal</button>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
